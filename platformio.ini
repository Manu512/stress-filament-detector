; Detecteur de stress filament - ESP32 Wemos D1 Mini 32
;
; Trois environnements :
;   wemos_d1_mini32      compilation et televersement par USB
;   wemos_d1_mini32_ota  televersement par le reseau
;   native               tests de la logique pure, sur PC, sans materiel
;
; Les identifiants WiFi ne sont plus compiles : ils vivent en NVS et se
; saisissent par le point d'acces de repli. Plus de config_private.h.

[env]
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
build_unflags = -std=gnu++11

[env:wemos_d1_mini32]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
lib_deps =
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
    bblanchon/ArduinoJson
; Les tests natifs ne doivent pas etre compiles pour la cible.
test_ignore = *

[env:wemos_d1_mini32_ota]
platform = ${env:wemos_d1_mini32.platform}
board = ${env:wemos_d1_mini32.board}
framework = ${env:wemos_d1_mini32.framework}
monitor_speed = ${env:wemos_d1_mini32.monitor_speed}
board_build.filesystem = ${env:wemos_d1_mini32.board_build.filesystem}
build_flags = ${env:wemos_d1_mini32.build_flags}
lib_deps = ${env:wemos_d1_mini32.lib_deps}
test_ignore = *
upload_protocol = espota
; Adapter a l'IP ou au nom d'hote du module avant usage (le mDNS est desactive)
upload_port = stress-filament.lan
upload_flags =
    --port=3232

; --------------------------------------------------------------------------
; Tests : logique pure, aucune dependance materielle.
;   pio test -e native
; --------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -I lib/stress_core
build_src_filter = -<*>
